[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-code-agent"
version = "0.1.0"
description = "Git-first coordination service for coding agents"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "mcp>=1.27,<2",
    "psycopg[binary]>=3.2,<4",
    "starlette>=1.3,<2",
    "uvicorn>=0.50,<1",
]

[project.scripts]
tca-mcp = "tca.mcp_server:main"
tca-app = "tca.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
